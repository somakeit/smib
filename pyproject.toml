[project]
name = "smib"
description = "The SoMakeIt Bot"
requires-python = ">=3.14.6,<4.0.0"
authors = [
    { name = "Sam Cork", email = "sam57719@gmail.com" }
]
license = "MIT"
license-files = { type = "Apache-2.0", path = "LICENSE" }
keywords = ["slack", "bot", "python"]
readme = "README.md"

dependencies = [
    "slack-bolt>=1.30.0,<2.0.0",
    "uvicorn==0.52.3",
    "aiohttp (>=3.14.3,<4.0.0)",
    "makefun>=1.16.0,<2.0.0",
    "apscheduler (>=3.11.3,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "humanize>=4.16.0",
    "pytz>=2026.3.post1",
    "beanie>=2.2.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "jinja2>=3.1.6",
    "websockets>=16.1.1",
    "packaging>=26.3",
]

dynamic = ["version"]

[tool.smib]
display_name = "S.M.I.B."

[build-system]
requires = [
    "hatchling (>=1.32.0,<2.0.0)",
    "hatch-vcs (>=0.5.0,<1.0.0)"
]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"
local_scheme = "node-and-timestamp"

[tool.hatch.build.targets.wheel]
packages = ["src/smib"]
